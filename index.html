  <script>
    // Înregistrarea service worker-ului funcționează doar peste http(s), nu la deschidere
    // directă de pe disc (file://) — de aceea e protejată de verificarea de mai jos.
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () { /* offline-ul rămâne indisponibil, aplicația merge normal */ });
      });
    }
  </script>
</body>
