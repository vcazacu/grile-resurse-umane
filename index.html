      <a class="nav-link" href="tematica/index.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"></path><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"></path></svg>

  <script src="intrebari.js"></script>
  <script src="app.js"></script>
  <script>
    // Înregistrarea service worker-ului funcționează doar peste http(s), nu la deschidere
    // directă de pe disc (file://) — de aceea e protejată de verificarea de mai jos.
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () { /* offline-ul rămâne indisponibil, aplicația merge normal */ });
      });
    }
  </script>
